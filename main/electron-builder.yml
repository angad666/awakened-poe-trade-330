publish:
  - "github"
productName: "Awakened PoE Trade"
npmRebuild: false
toolsets:
  appimage: 1.0.3
artifactBuildCompleted: "build/apprun-patch.test.mjs"
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
electronFuses:
  # ignore ELECTRON_RUN_AS_NODE inherited from the launching environment
  # (e.g. a VS Code terminal); with it set the app would exit without a window
  runAsNode: false
  resetAdHocDarwinSignature: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
win:
  target:
  - "nsis"
  - "portable"
linux:
  target:
  - "AppImage"
mac:
  target:
  - target: "dmg"
    arch:
    - "universal"
  identity: null
  x64ArchFiles: "*"
